<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>La mia spesa</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F1F5F9" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spesa">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg-main: #F1F5F9;
    --bg-card: #FFFFFF;
    --bg-card-sub: #F8FAFC;
    --border-color: #E2E8F0;
    --text-primary: #0F172A;
    --text-secondary: #64748B;
    --text-muted: #94A3B8;
    --accent: #2563EB;
    --sheet-bg: rgba(255, 255, 255, 0.96);
    --modal-overlay: rgba(15, 23, 42, 0.4);
  }
  [data-theme="dark"] {
    --bg-main: #0F172A;
    --bg-card: #1E293B;
    --bg-card-sub: #0F172A;
    --border-color: #334155;
    --text-primary: #F8FAFC;
    --text-secondary: #94A3B8;
    --text-muted: #64748B;
    --accent: #3B82F6;
    --sheet-bg: rgba(30, 41, 59, 0.96);
    --modal-overlay: rgba(0, 0, 0, 0.6);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Roboto', sans-serif;
    background: var(--bg-main); color: var(--text-primary);
    overscroll-behavior-y: none; overflow: hidden;
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  #app { 
    max-width: 480px; margin: 0 auto; height: 100vh; 
    position: relative; display: flex; flex-direction: column; 
  }
  .header-container {
    padding: 20px 20px 10px;
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .header-titles h1 { font-size: 28px; font-weight: 800; margin: 0; letter-spacing: -0.02em; color: var(--text-primary); }
  .header-titles p { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin: 2px 0 0; }
  .header-actions { display: flex; gap: 8px; }
  .icon-btn {
    background: var(--bg-card); border: 1px solid var(--border-color); width: 42px; height: 42px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: 0 2px 5px rgba(0,0,0,0.04); transition: transform 0.2s ease, background 0.3s ease, border-color 0.3s ease; flex-shrink: 0;
  }
  .icon-btn:active { transform: scale(0.92); }
  .icon-btn.active { border-color: var(--accent); background: var(--bg-card-sub); }
  .icon-btn.active svg { stroke: var(--accent); }
  @keyframes planeTakeoff {
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    40% { transform: translate(12px, -12px) scale(1.1); opacity: 0.8; }
    50% { transform: translate(25px, -25px) scale(0.6); opacity: 0; }
    51% { transform: translate(-25px, 25px) scale(0.6); opacity: 0; }
    100% { transform: translate(0, 0) scale(1); opacity: 1; }
  }
  .animate-plane { animation: planeTakeoff 0.65s cubic-bezier(0.4, 0, 0.2, 1); }
  .view-container { flex: 1; overflow-y: auto; padding: 0 16px 120px; }
  .empty { text-align: center; color: var(--text-muted); font-size: 15px; font-weight: 500; margin-top: 60px; padding: 0 30px; line-height: 1.6; }
  .list { position: relative; }
  .card {
    display: flex; align-items: center;
    background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px;
    padding: 14px 16px; margin-bottom: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    transition: transform 0.35s cubic-bezier(0.2, 0, 0, 1), opacity 0.3s ease, background 0.3s ease, border-color 0.3s ease, max-height 0.35s ease, margin 0.35s ease, padding 0.35s ease;
    max-height: 80px; overflow: hidden; will-change: transform, opacity;
  }
  .card:active { transform: scale(0.98); }
  .card.done { opacity: 0.55; background: var(--bg-card-sub); }
  .card.hidden-item {
    opacity: 0; transform: scale(0.9) translateY(-10px);
    max-height: 0; margin-bottom: 0; padding-top: 0; padding-bottom: 0; border: none; pointer-events: none;
  }
  .card.removing {
    opacity: 0; transform: scale(0.8) translateY(10px);
    max-height: 0; margin-bottom: 0; padding-top: 0; padding-bottom: 0; border: none;
  }
  .check {
    width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--text-muted); background: var(--bg-card);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .check.done { background: #10B981; border-color: #10B981; }
  .card-text { flex: 1; margin: 0 12px; cursor: pointer; position: relative; }
  .card-text span {
    font-size: 16px; font-weight: 600; color: var(--text-primary);
    position: relative; display: inline-block; transition: color 0.3s ease;
  }
  .card-text span::after {
    content: ''; position: absolute; left: 0; top: 50%; width: 0%; height: 2px;
    background: var(--text-muted); transition: width 0.3s cubic-bezier(0.25, 1, 0.5, 1);
  }
  .card.done .card-text span { color: var(--text-muted); }
  .card.done .card-text span::after { width: 100%; }
  .badge { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .del-btn { 
    background: none; border: none; color: var(--text-muted); font-size: 16px; 
    padding: 4px 6px 4px 10px; cursor: pointer; transition: color 0.2s ease, transform 0.2s ease; 
  }
  .del-btn:active { transform: scale(1.2); color: #EF4444; }
  .modal-overlay {
    position: fixed; inset: 0; background: var(--modal-overlay); z-index: 200;
    display: flex; align-items: center; justify-content: center; padding: 20px;
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .modal-overlay.active { opacity: 1; pointer-events: auto; }
  .modal-card {
    background: var(--bg-card); border: 1px solid var(--border-color);
    border-radius: 24px; padding: 24px; width: 100%; max-width: 320px;
    text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    transform: scale(0.9) translateY(10px); transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .modal-overlay.active .modal-card { transform: scale(1) translateY(0); }
  .modal-icon-svg { margin-bottom: 12px; display: flex; justify-content: center; }
  .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 6px; color: var(--text-primary); }
  .modal-desc { font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; line-height: 1.4; }
  .modal-input {
    width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border-color);
    background: var(--bg-main); color: var(--text-primary); font-size: 15px; font-weight: 600;
    margin-bottom: 10px; outline: none;
  }
  .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
  .modal-btn {
    flex: 1; padding: 12px; border-radius: 14px; font-size: 14px; font-weight: 700; border: none; cursor: pointer;
    transition: transform 0.15s ease, background 0.2s ease;
  }
  .modal-btn:active { transform: scale(0.96); }
  .modal-btn.cancel { background: var(--bg-main); color: var(--text-primary); border: 1px solid var(--border-color); }
  .modal-btn.confirm-accent { background: var(--accent); color: white; }
  .modal-btn.confirm-danger { background: #EF4444; color: white; }
  .settings-row {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--bg-card); border-radius: 16px; padding: 16px; margin-bottom: 10px;
    border: 1px solid var(--border-color); font-size: 15px; font-weight: 600; color: var(--text-primary); cursor: pointer; width: 100%;
    transition: background 0.3s ease, border-color 0.3s ease; text-align: left;
  }
  .settings-row .left { display: flex; align-items: center; gap: 12px; }
  .settings-row.disabled { opacity: 0.4; pointer-events: none; }
  .settings-row.danger { color: #EF4444; }
  .archive-card {
    background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px;
    padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.02);
  }
  .archive-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .archive-title { font-size: 16px; font-weight: 700; color: var(--text-primary); }
  .archive-total { font-size: 15px; font-weight: 800; color: #10B981; }
  .archive-date { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-bottom: 8px; }
  .archive-preview { font-size: 13px; color: var(--text-secondary); margin-bottom: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .archive-actions { display: flex; gap: 8px; }
  .archive-btn {
    padding: 8px 14px; border-radius: 10px; font-size: 12px; font-weight: 700; border: none; cursor: pointer;
  }
  .archive-btn.restore { background: var(--accent); color: white; }
  .archive-btn.delete { background: var(--bg-main); color: #EF4444; border: 1px solid var(--border-color); }
  .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
    background-color: var(--border-color); transition: .3s; border-radius: 24px;
  }
  .slider:before {
    position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
    background-color: white; transition: .3s; border-radius: 50%;
  }
  input:checked + .slider { background-color: var(--accent); }
  input:checked + .slider:before { transform: translateX(20px); }
  .fab-wrapper {
    position: fixed; right: 16px; bottom: 38px; z-index: 90;
    display: flex; align-items: center; justify-content: flex-end;
    width: calc(100% - 32px); max-width: 448px; pointer-events: none;
  }
  .fab-container {
    pointer-events: auto; display: flex; align-items: center;
    background: var(--accent); height: 56px; width: 56px; border-radius: 28px;
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
    transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.2s ease, box-shadow 0.3s ease;
    overflow: hidden; position: relative;
  }
  .fab-container.expanded {
    width: 100%; background: var(--bg-card);
    border: 2px solid var(--accent); box-shadow: 0 10px 25px rgba(37, 99, 235, 0.2);
  }
  .fab-input {
    flex: 1; border: none; outline: none; background: transparent;
    padding: 0 0 0 20px; font-size: 16px; font-weight: 600; color: var(--text-primary);
    opacity: 0; transition: opacity 0.2s ease; display: none;
  }
  .fab-container.expanded .fab-input { display: block; opacity: 1; }
  .fab-btn {
    width: 56px; height: 56px; border: none; background: transparent;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; position: absolute; right: 0; top: 0;
  }
  .fab-icon { stroke: white; transition: stroke 0.2s ease; }
  .fab-container.expanded .fab-icon { stroke: var(--accent); }
  .bottom-sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 100;
    max-width: 480px; margin: 0 auto;
    transform: translateY(calc(100% - 24px));
    transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .bottom-sheet.open, .bottom-sheet.always-visible { transform: translateY(0); }
  .sheet-handle-area {
    width: 100%; height: 24px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .sheet-handle-pill {
    width: 36px; height: 5px; border-radius: 3px; background: var(--text-muted);
    transition: background 0.2s ease;
  }
  .sheet-content {
    background: var(--sheet-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border-color); border-radius: 20px 20px 0 0;
    padding: 8px 12px 20px; box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.08);
  }
  .tabs { display: flex; justify-content: space-around; }
  .tab { 
    display: flex; flex-direction: column; align-items: center; gap: 4px; 
    padding: 8px 12px; border: none; background: none; cursor: pointer;
  }
  .tab svg { stroke: var(--text-muted); transition: stroke 0.2s ease; }
  .tab .lbl { font-size: 11px; font-weight: 700; color: var(--text-muted); }
  .tab.active svg { stroke: var(--accent); }
  .tab.active .lbl { color: var(--accent); }
  .view { display: none; }
  .view.active { display: block; }
  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); z-index: 95;
    opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
  }
  .sheet-backdrop.active { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>
<div id="app">
  <div class="header-container">
    <div class="header-titles">
      <h1 id="pageTitle">La mia spesa</h1>
      <p id="pageSub">0 articoli</p>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="hideDoneBtn" onclick="toggleHideDone()" aria-label="Nascondi completati">
        <svg id="hideDoneIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
      <button class="icon-btn" id="shareHeaderBtn" onclick="shareList(this)" aria-label="Condividi">
        <svg class="plane-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="view-container" id="swipeArea">
    <div class="view active" id="view-lista">
      <div class="list" id="listActive"></div>
    </div>
    <div class="view" id="view-frequenti">
      <div class="list" id="freqList"></div>
    </div>
    <div class="view" id="view-archivio">
      <div id="archiveList"></div>
    </div>
    <div class="view" id="view-impostazioni">
      <div class="settings-row" onclick="toggleThemeToggle()">
        <div class="left">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <span>Tema Scuro</span>
        </div>
        <label class="switch" onclick="event.stopPropagation()">
          <input type="checkbox" id="themeToggle" onchange="switchTheme(this.checked)">
          <span class="slider"></span>
        </label>
      </div>
      <button class="settings-row" onclick="shareList(this)">
        <div class="left">
          <svg class="plane-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
          <span>Condividi lista via Link</span>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <button class="settings-row danger" id="btnClearAll" onclick="clearAll()">
        <div class="left">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <span>Svuota tutta la lista</span>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
  </div>
  <div class="fab-wrapper" id="fabWrapper">
    <div class="fab-container" id="fabContainer">
      <input type="text" id="fabInput" class="fab-input" placeholder="Scrivi articolo..." autocomplete="off">
      <button class="fab-btn" id="fabBtn" onclick="handleFabClick()" aria-label="Aggiungi">
        <svg class="fab-icon" id="fabIcon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2.8" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
  </div>
  <div class="sheet-backdrop" id="sheetBackdrop" onclick="closeSheet()"></div>
  <div class="bottom-sheet" id="bottomSheet">
    <div class="sheet-handle-area" id="sheetHandle">
      <div class="sheet-handle-pill"></div>
    </div>
    <div class="sheet-content">
      <div class="tabs">
        <button class="tab" id="tab-impostazioni" onclick="switchTab('impostazioni')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06.06a1.65 1.65 0 0 0 .33-1.82V9a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span class="lbl">Opzioni</span>
        </button>
        <button class="tab" id="tab-archivio" onclick="switchTab('archivio')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
          <span class="lbl">Archivio</span>
        </button>
        <button class="tab" id="tab-frequenti" onclick="switchTab('frequenti')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span class="lbl">Frequenti</span>
        </button>
        <button class="tab active" id="tab-lista" onclick="switchTab('lista')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span class="lbl">Lista</span>
        </button>
      </div>
    </div>
  </div>
  <div class="modal-overlay" id="confirmModal">
    <div class="modal-card">
      <div class="modal-icon-svg" id="modalIcon"></div>
      <div class="modal-title" id="modalTitle">Titolo</div>
      <div class="modal-desc" id="modalDesc">Descrizione</div>
      <input type="text" id="modalInputTotal" class="modal-input" style="display:none;" placeholder="Totale speso (€) es: 34.50" inputmode="decimal">
      <input type="text" id="modalInputName" class="modal-input" style="display:none;" placeholder="Nome lista (opzionale)">
      <div class="modal-actions">
        <button class="modal-btn cancel" id="modalCancelBtn" onclick="closeModal()">Annulla</button>
        <button class="modal-btn confirm-accent" id="modalConfirmBtn">Conferma</button>
      </div>
    </div>
  </div>
</div>
<script>
const DICTIONARY = {
  mela:'Ortofrutta', mele:'Ortofrutta', pera:'Ortofrutta', pere:'Ortofrutta', banana:'Ortofrutta', banane:'Ortofrutta', 
  pomodoro:'Ortofrutta', pomodori:'Ortofrutta', insalata:'Ortofrutta', carota:'Ortofrutta', carote:'Ortofrutta', 
  zucchina:'Ortofrutta', zucchine:'Ortofrutta', patata:'Ortofrutta', patate:'Ortofrutta', cipolla:'Ortofrutta', cipolle:'Ortofrutta', 
  limone:'Ortofrutta', limoni:'Ortofrutta', arancia:'Ortofrutta', arance:'Ortofrutta', fragola:'Ortofrutta', fragole:'Ortofrutta',
  latte:'Latticini', yogurt:'Latticini', formaggio:'Latticini', mozzarella:'Latticini', parmigiano:'Latticini', burro:'Latticini',
  crudo:'Carne e Pesce', prosciutto:'Carne e Pesce', cotto:'Carne e Pesce', salame:'Carne e Pesce', pollo:'Carne e Pesce', 
  pasta:'Dispensa', riso:'Dispensa', pane:'Dispensa', farina:'Dispensa', zucchero:'Dispensa', sale:'Dispensa', olio:'Dispensa',
  acqua:'Bevande', vino:'Bevande', birra:'Bevande', succo:'Bevande',
  detersivo:'Pulizia', sapone:'Pulizia', carta:'Pulizia', bagnoschiuma:'Pulizia'
};
const CATEGORY_STYLES = {
  'Ortofrutta':     { bg:'#DCFCE7', text:'#15803D' },
  'Latticini':      { bg:'#E0F2FE', text:'#0369A1' },
  'Dispensa':       { bg:'#FFEDD5', text:'#C2410C' },
  'Carne e Pesce':  { bg:'#FFE4E6', text:'#E11D48' },
  'Bevande':        { bg:'#E0E7FF', text:'#4338CA' },
  'Pulizia':        { bg:'#F3E8FF', text:'#6B21A8' },
  'Altro':          { bg:'#F1F5F9', text:'#475569' },
};
function getBaseKey(text) {
  if (!text) return '';
  let clean = text.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/^\d+[.,]?\d*\s*(kg|gr|g|l|ml)?\s*/i, '')
    .trim();
  if (DICTIONARY[clean]) return clean;
  for (const token of clean.split(/\s+/)) {
    if (DICTIONARY[token]) return token;
  }
  if (clean.length > 3) {
    if (clean.endsWith('e')) return clean.slice(0, -1) + 'a';
    if (clean.endsWith('i')) return clean.slice(0, -1) + 'o';
  }
  return clean;
}
function cleanDisplayTitle(text) {
  let cleaned = text.replace(/^\d+[.,]?\d*\s*(kg|gr|g|l|ml)?\s*/i, '').trim();
  if (!cleaned) cleaned = text.trim();
  return cleaned.charAt(0).toUpperCase() + cleaned.slice(1);
}
function categorize(rawName) {
  const key = getBaseKey(rawName);
  return DICTIONARY[key] || 'Altro';
}
const STORAGE_KEY = 'spesa-app-v12';
const ARCHIVE_KEY = 'spesa-app-archive';
const THEME_KEY = 'spesa-app-theme';
const HIDE_DONE_KEY = 'spesa-app-hide-done';
function loadData(key) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}
let items = loadData(STORAGE_KEY);
let archives = loadData(ARCHIVE_KEY);
let hideDone = localStorage.getItem(HIDE_DONE_KEY) === 'true';
function saveItems() { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }
function saveArchive() { localStorage.setItem(ARCHIVE_KEY, JSON.stringify(archives)); }
const TABS_ORDER = ['impostazioni', 'archivio', 'frequenti', 'lista'];
let activeTab = 'lista';
let modalCallback = null;
function initTheme() {
  const savedTheme = localStorage.getItem(THEME_KEY) || 'light';
  const isDark = savedTheme === 'dark';
  document.documentElement.setAttribute('data-theme', savedTheme);
  document.getElementById('themeToggle').checked = isDark;
  document.getElementById('themeColor').setAttribute('content', isDark ? '#0F172A' : '#F1F5F9');
  updateHideDoneUI();
}
function switchTheme(isDark) {
  const theme = isDark ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem(THEME_KEY, theme);
  document.getElementById('themeColor').setAttribute('content', isDark ? '#0F172A' : '#F1F5F9');
}
function toggleThemeToggle() {
  const toggle = document.getElementById('themeToggle');
  toggle.checked = !toggle.checked;
  switchTheme(toggle.checked);
}
function toggleHideDone() {
  hideDone = !hideDone;
  localStorage.setItem(HIDE_DONE_KEY, hideDone);
  updateHideDoneUI();
  renderAllWithAnimation();
}
function updateHideDoneUI() {
  const btn = document.getElementById('hideDoneBtn');
  const icon = document.getElementById('hideDoneIcon');
  if (hideDone) {
    btn.classList.add('active');
    icon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`;
  } else {
    btn.classList.remove('active');
    icon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
  }
}
function openModal(options) {
  const { title, desc, svgIcon, showInputs, confirmText, cancelText, isDanger, onConfirm } = options;
  document.getElementById('modalTitle').textContent = title || '';
  document.getElementById('modalDesc').textContent = desc || '';
  const iconEl = document.getElementById('modalIcon');
  if (svgIcon) {
    iconEl.innerHTML = svgIcon;
    iconEl.style.display = 'flex';
  } else {
    iconEl.style.display = 'none';
  }
  const inputTotal = document.getElementById('modalInputTotal');
  const inputName = document.getElementById('modalInputName');
  if (showInputs) {
    inputTotal.style.display = 'block';
    inputName.style.display = 'block';
    inputTotal.value = '';
    inputName.value = '';
    setTimeout(() => inputTotal.focus(), 150);
  } else {
    inputTotal.style.display = 'none';
    inputName.style.display = 'none';
  }
  const confirmBtn = document.getElementById('modalConfirmBtn');
  const cancelBtn = document.getElementById('modalCancelBtn');
  confirmBtn.textContent = confirmText || 'Conferma';
  confirmBtn.className = `modal-btn ${isDanger ? 'confirm-danger' : 'confirm-accent'}`;
  cancelBtn.textContent = cancelText || 'Annulla';
  modalCallback = onConfirm;
  document.getElementById('confirmModal').classList.add('active');
}
function closeModal() {
  document.getElementById('confirmModal').classList.remove('active');
  modalCallback = null;
}
document.getElementById('modalConfirmBtn').addEventListener('click', () => {
  const totalVal = document.getElementById('modalInputTotal').value.trim();
  const nameVal = document.getElementById('modalInputName').value.trim();
  if (modalCallback) modalCallback({ total: totalVal, name: nameVal });
  closeModal();
});
function shareList(btnElement) {
  if (items.length === 0) return;
  const planeIcon = btnElement ? btnElement.querySelector('.plane-icon') : null;
  if (planeIcon) {
    planeIcon.classList.add('animate-plane');
    setTimeout(() => planeIcon.classList.remove('animate-plane'), 650);
  }
  const namesArray = items.map(i => i.name);
  const encoded = btoa(encodeURI(JSON.stringify(namesArray)));
  const shareUrl = `${window.location.origin}${window.location.pathname}?data=${encoded}`;
  if (navigator.share) {
    navigator.share({ title: 'Spesa', text: 'Ecco la mia lista:', url: shareUrl }).catch(() => {});
  } else {
    navigator.clipboard.writeText(shareUrl);
  }
}
function handleFabClick() {
  const container = document.getElementById('fabContainer');
  const input = document.getElementById('fabInput');
  if (!container.classList.contains('expanded')) {
    container.classList.add('expanded');
    setTimeout(() => input.focus(), 150);
  } else {
    const name = input.value.trim();
    if (name) {
      addItem(name);
      input.value = '';
    } else {
      closeFab();
    }
  }
}
function closeFab() {
  const container = document.getElementById('fabContainer');
  const input = document.getElementById('fabInput');
  container.classList.remove('expanded');
  input.blur();
}
document.addEventListener('click', (e) => {
  const fabWrapper = document.getElementById('fabWrapper');
  if (fabWrapper && !fabWrapper.contains(e.target)) {
    const input = document.getElementById('fabInput');
    if (input && !input.value.trim()) closeFab();
  }
});
function addItem(name) {
  const key = getBaseKey(name);
  const existing = items.find(i => getBaseKey(i.name) === key);
  if (existing) {
    existing.isCompleted = false;
    existing.createdAt = Date.now();
  } else {
    items.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
      name: cleanDisplayTitle(name),
      category: categorize(name),
      isCompleted: false,
      createdAt: Date.now()
    });
  }
  saveItems();
  renderAllWithAnimation();
}
function toggleItem(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  const card = document.getElementById(`card-${id}`);
  if (card) {
    if (!item.isCompleted) {
      card.classList.add('done');
      const check = card.querySelector('.check');
      if (check) {
        check.classList.add('done');
        check.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="4"><polyline points="20 6 9 17 4 12"/></svg>';
      }
    } else {
      card.classList.remove('done');
      const check = card.querySelector('.check');
      if (check) {
        check.classList.remove('done');
        check.innerHTML = '';
      }
    }
  }
  setTimeout(() => {
    item.isCompleted = !item.isCompleted;
    saveItems();
    renderAllWithAnimation();
    if (items.length > 0 && items.every(i => i.isCompleted)) {
      triggerCompletionFlow();
    }
  }, 320);
}
function triggerCompletionFlow() {
  const todayStr = new Date().toLocaleDateString('it-IT', { day: '2-digit', month: 'short', year: 'numeric' });
  openModal({
    title: 'Spesa completata',
    desc: `Hai acquistato tutti i ${items.length} articoli. Vuoi archiviare questa lista?`,
    svgIcon: `<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`,
    showInputs: true,
    confirmText: 'Archivia e svuota',
    cancelText: 'Non ora',
    onConfirm: ({ total, name }) => {
      const archiveTitle = name || `Spesa del ${todayStr}`;
      archives.unshift({
        id: Date.now().toString(36),
        name: archiveTitle,
        date: todayStr,
        total: total ? parseFloat(total.replace(',', '.')).toFixed(2) : null,
        items: JSON.parse(JSON.stringify(items))
      });
      saveArchive();
      items = [];
      saveItems();
      renderAllWithAnimation();
    }
  });
}
function deleteItem(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  openModal({
    title: 'Elimina articolo',
    desc: `Vuoi davvero rimuovere "${item.name}"?`,
    svgIcon: `<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`,
    confirmText: 'Elimina',
    isDanger: true,
    onConfirm: () => {
      const card = document.getElementById(`card-${id}`);
      if (card) {
        card.classList.add('removing');
        setTimeout(() => {
          items = items.filter(i => i.id !== id);
          saveItems();
          renderAllWithAnimation();
        }, 300);
      } else {
        items = items.filter(i => i.id !== id);
        saveItems();
        renderAllWithAnimation();
      }
    }
  });
}
function clearAll() {
  openModal({
    title: 'Svuota lista',
    desc: 'Sei sicuro di voler svuotare interamente la lista?',
    svgIcon: `<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
    confirmText: 'Svuota',
    isDanger: true,
    onConfirm: () => {
      items = [];
      saveItems();
      renderAllWithAnimation();
    }
  });
}
function restoreArchive(id) {
  const arch = archives.find(a => a.id === id);
  if (!arch) return;
  openModal({
    title: 'Ripristina lista',
    desc: `Vuoi caricare la lista "${arch.name}"? Gli articoli verranno ripristinati per essere spuntati.`,
    svgIcon: `<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>`,
    confirmText: 'Ripristina',
    onConfirm: () => {
      items = arch.items.map(i => ({
        ...i,
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
        isCompleted: false,
        createdAt: Date.now()
      }));
      saveItems();
      switchTab('lista');
      renderAllWithAnimation();
    }
  });
}
function deleteArchive(id) {
  openModal({
    title: 'Elimina archivio',
    desc: 'Sei sicuro di voler rimuovere questa lista salvata?',
    svgIcon: `<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`,
    confirmText: 'Elimina',
    isDanger: true,
    onConfirm: () => {
      archives = archives.filter(a => a.id !== id);
      saveArchive();
      renderAll();
    }
  });
}
function renderAllWithAnimation() {
  const activeContainer = document.getElementById('listActive');
  const allCards = Array.from(activeContainer.children);
  const firstPositions = new Map();
  allCards.forEach(card => {
    if (card.id) firstPositions.set(card.id, card.getBoundingClientRect().top);
  });
  renderAll();
  const newCards = Array.from(activeContainer.children);
  newCards.forEach(card => {
    if (card.id && firstPositions.has(card.id)) {
      const firstTop = firstPositions.get(card.id);
      const lastTop = card.getBoundingClientRect().top;
      const deltaY = firstTop - lastTop;
      if (deltaY !== 0) {
        card.style.transform = `translateY(${deltaY}px)`;
        card.style.transition = 'none';
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            card.style.transition = 'transform 0.35s cubic-bezier(0.2, 0, 0, 1)';
            card.style.transform = '';
          });
        });
      }
    }
  });
}
function createCardHTML(item) {
  const style = CATEGORY_STYLES[item.category] || CATEGORY_STYLES['Altro'];
  const nameSafe = item.name.replace(/'/g, "&#39;");
  const isHidden = hideDone && item.isCompleted;
  return `
    <div class="card ${item.isCompleted ? 'done' : ''} ${isHidden ? 'hidden-item' : ''}" id="card-${item.id}">
      <div class="check ${item.isCompleted ? 'done' : ''}" onclick="toggleItem('${item.id}')">
        ${item.isCompleted ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="4"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
      </div>
      <div class="card-text" onclick="toggleItem('${item.id}')">
        <span>${nameSafe}</span>
      </div>
      <div class="badge" style="background:${style.bg};color:${style.text}">${item.category}</div>
      <button class="del-btn" onclick="deleteItem('${item.id}')" aria-label="Elimina">✕</button>
    </div>`;
}
function renderList() {
  const activeEl = document.getElementById('listActive');
  if (items.length === 0) {
    activeEl.innerHTML = '<div class="empty">La lista è vuota. Usa il tasto + per aggiungere un articolo.</div>';
  } else {
    const sorted = [...items].sort((a, b) => {
      if (a.isCompleted === b.isCompleted) return a.createdAt - b.createdAt;
      return a.isCompleted ? -1 : 1;
    });
    activeEl.innerHTML = sorted.map(item => createCardHTML(item)).join('');
  }
  updateHeader();
}
function renderFrequent() {
  const freqList = document.getElementById('freqList');
  const counts = {};
  items.forEach(i => {
    const key = getBaseKey(i.name);
    if (!key) return;
    if (!counts[key]) counts[key] = { count: 0, rawName: i.name, category: i.category };
    counts[key].count += 1;
  });
  archives.forEach(arch => {
    arch.items.forEach(i => {
      const key = getBaseKey(i.name);
      if (!key) return;
      if (!counts[key]) counts[key] = { count: 0, rawName: i.name, category: i.category };
      counts[key].count += 1;
    });
  });
  const frequentList = Object.values(counts)
    .filter(item => item.count >= 2)
    .sort((a, b) => b.count - a.count);
  if (frequentList.length === 0) {
    freqList.innerHTML = '<div class="empty">Gli articoli usati più di una volta appariranno qui.</div>';
    return;
  }
  freqList.innerHTML = frequentList.map(item => {
    const displayName = cleanDisplayTitle(item.rawName);
    const category = categorize(displayName);
    const style = CATEGORY_STYLES[category] || CATEGORY_STYLES['Altro'];
    const nameSafe = displayName.replace(/'/g, "\\'");
    return `
      <div class="card" onclick="addFromFrequent('${nameSafe}')">
        <div class="card-text"><span>${displayName}</span></div>
        <div class="badge" style="background:${style.bg};color:${style.text}">${category}</div>
      </div>`;
  }).join('');
}
function renderArchive() {
  const archEl = document.getElementById('archiveList');
  if (archives.length === 0) {
    archEl.innerHTML = '<div class="empty">Nessuna lista archiviata. Quando completi una spesa apparirà qui.</div>';
    return;
  }
  archEl.innerHTML = archives.map(a => {
    const preview = a.items.map(i => i.name).join(', ');
    const totalDisplay = a.total ? `€${a.total}` : '';
    return `
      <div class="archive-card">
        <div class="archive-header">
          <div class="archive-title">${a.name}</div>
          ${totalDisplay ? `<div class="archive-total">${totalDisplay}</div>` : ''}
        </div>
        <div class="archive-date">${a.date} • ${a.items.length} articoli</div>
        <div class="archive-preview">${preview}</div>
        <div class="archive-actions">
          <button class="archive-btn restore" onclick="restoreArchive('${a.id}')">Ripristina</button>
          <button class="archive-btn delete" onclick="deleteArchive('${a.id}')">Elimina</button>
        </div>
      </div>`;
  }).join('');
}
function addFromFrequent(name) {
  addItem(name);
  switchTab('lista');
}
function updateHeader() {
  const total = items.length;
  const done = items.filter(i => i.isCompleted).length;
  const pTitle = document.getElementById('pageTitle');
  const pSub = document.getElementById('pageSub');
  if (activeTab === 'lista') {
    pTitle.textContent = "La mia spesa";
    pSub.textContent = `${done}/${total} completati`;
  } else if (activeTab === 'frequenti') {
    pTitle.textContent = "Frequenti";
    pSub.textContent = "Tocca per riaggiungere";
  } else if (activeTab === 'archivio') {
    pTitle.textContent = "Archivio";
    pSub.textContent = `${archives.length} liste salvate`;
  } else {
    pTitle.textContent = "Opzioni";
    pSub.textContent = `${total} articoli totali`;
  }
  const btnAll = document.getElementById('btnClearAll');
  if (btnAll) btnAll.classList.toggle('disabled', total === 0);
}
function renderAll() { renderList(); renderFrequent(); renderArchive(); updateHeader(); }
function closeSheet() {
  document.getElementById('bottomSheet').classList.remove('open');
  document.getElementById('sheetBackdrop').classList.remove('active');
}
function toggleSheet() {
  const sheet = document.getElementById('bottomSheet');
  const backdrop = document.getElementById('sheetBackdrop');
  sheet.classList.toggle('open');
  backdrop.classList.toggle('active');
}
function switchTab(tab) {
  activeTab = tab;
  const sheet = document.getElementById('bottomSheet');
  if (tab === 'lista') {
    sheet.classList.remove('always-visible');
  } else {
    sheet.classList.add('always-visible');
  }
  TABS_ORDER.forEach(t => {
    const viewEl = document.getElementById('view-' + t);
    const tabEl = document.getElementById('tab-' + t);
    const isActive = t === tab;
    if (viewEl) viewEl.classList.toggle('active', isActive);
    if (tabEl) tabEl.classList.toggle('active', isActive);
  });
  updateHeader();
  closeSheet();
}
let touchStartX = 0;
let touchStartY = 0;
const swipeArea = document.getElementById('swipeArea');
swipeArea.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, {passive: true});
swipeArea.addEventListener('touchend', e => {
  const diffX = e.changedTouches[0].clientX - touchStartX;
  const diffY = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(diffX) > 40 && Math.abs(diffX) > Math.abs(diffY)) {
    const currentIndex = TABS_ORDER.indexOf(activeTab);
    if (diffX < 0 && currentIndex < TABS_ORDER.length - 1) {
      switchTab(TABS_ORDER[currentIndex + 1]);
    } else if (diffX > 0 && currentIndex > 0) {
      switchTab(TABS_ORDER[currentIndex - 1]);
    }
  }
}, {passive: true});
const sheetHandle = document.getElementById('sheetHandle');
sheetHandle.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, {passive: true});
sheetHandle.addEventListener('touchend', e => {
  const endY = e.changedTouches[0].clientY;
  if (touchStartY - endY > 20 || Math.abs(touchStartY - endY) < 10) toggleSheet();
}, {passive: true});
document.getElementById('fabInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    handleFabClick();
  }
});
// Import from share URL
(function() {
  const params = new URLSearchParams(window.location.search);
  const data = params.get('data');
  if (data) {
    try {
      const names = JSON.parse(decodeURI(atob(data)));
      if (Array.isArray(names)) {
        names.forEach(n => addItem(n));
        history.replaceState(null, '', window.location.pathname);
      }
    } catch(e) {}
  }
})();
initTheme();
renderAll();
// Service Worker registration
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
